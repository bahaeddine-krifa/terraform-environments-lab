
name: Terraform Environment Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Generate saved plan
        run: terraform plan -input=false -no-color -out="${{ matrix.environment }}.tfplan"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/${{ matrix.environment }}.tfplan
          retention-days: 3

  security-scan:
    name: Trivy IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.76.1"
          scan-type: "config"
          scan-ref: "."
          hide-progress: true
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          cache: "false"

  approval-demo:
    name: Manual Approval Demo
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    environment: production-approval

    steps:
      - name: Confirm approval
        run: echo "Approval received. No infrastructure was deployed."